name: ci

# Tests on every push and PR. Deploys are done by Cloudflare Workers Builds
# (connected to this repo), which runs `npm run build` and `npm run deploy:cf` on main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
