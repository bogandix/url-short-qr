name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations
        run: npm run migrate
        env:
          SHORTENER_DATABASE_URL: ${{ secrets.SHORTENER_DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - run: npm run build
      - name: Deploy edge
        run: npx wrangler deploy -c apps/edge/wrangler.jsonc
      - name: Deploy consumer (paid mode)
        run: |
          if grep -q '"MODE": "paid"' apps/edge/wrangler.jsonc; then
            npx wrangler deploy -c apps/consumer/wrangler.jsonc
          fi
      - name: Smoke (every domain)
        run: npm run smoke
        env:
          SHORTENER_API_KEY: ${{ secrets.SHORTENER_API_KEY }}
          SHORTENER_ADMIN_HOST: ${{ vars.SHORTENER_ADMIN_HOST }}
          SHORTENER_DOMAINS: ${{ vars.SHORTENER_DOMAINS }}
